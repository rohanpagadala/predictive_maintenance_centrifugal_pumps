services:
  api:
    build: .
    image: pdm-app:latest
    container_name: pdm-api
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${PDM_API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PDM_HOST=0.0.0.0
      - PDM_PORT=8000
      - PDM_ENV=${PDM_ENV:-production}
      - PDM_API_KEY_REQUIRED=${PDM_API_KEY_REQUIRED:-true}
      - PDM_API_KEY=${PDM_API_KEY:?PDM_API_KEY must be set -- see .env.production}
      - PDM_ALLOWED_ORIGINS=${PDM_ALLOWED_ORIGINS:-http://localhost:8501}
      - PDM_RATE_LIMIT_PREDICT=${PDM_RATE_LIMIT_PREDICT:-20/minute}
      - PDM_RATE_LIMIT_DEFAULT=${PDM_RATE_LIMIT_DEFAULT:-120/minute}
      - PDM_LOG_LEVEL=${PDM_LOG_LEVEL:-WARNING}
    volumes:
      - ./models:/srv/app/models
      - ./logs:/srv/app/logs
      - ./outputs:/srv/app/outputs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  dashboard:
    build: .
    image: pdm-app:latest
    container_name: pdm-dashboard
    command: ["streamlit", "run", "dashboard/streamlit_app.py",
              "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true"]
    ports:
      - "${PDM_DASHBOARD_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      - PDM_API_URL=http://api:8000
      - PDM_ENV=${PDM_ENV:-production}
    volumes:
      - ./models:/srv/app/models:ro
      - ./outputs:/srv/app/outputs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
